<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SNK Life Manager - Mobile</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.441.0/dist/umd/lucide.min.js"></script>
<style>
:root{--bg:#080f0d;--side:#0b1511;--bd:#263b2e;--card:#101e18;--card2:#16271f;--card3:#233b23;--lime:#bcf568;--tx:#f1f5ed;--mu:#a4b5a7;--dim:#718578;--red:#f0a28f;--ink:#101a0c}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:13px/1.5 'Noto Sans Bengali','Inter',sans-serif;display:flex;justify-content:center}
svg.lucide,i[data-lucide]{width:20px;height:20px;stroke:var(--lime);flex-shrink:0}
#app{width:100%;max-width:430px;min-height:100vh;position:relative;padding-bottom:calc(98px + env(safe-area-inset-bottom))}
.hd{display:flex;align-items:center;gap:12px;padding:calc(16px + env(safe-area-inset-top)) 22px 16px}
.av{width:42px;height:42px;border-radius:50%;background:var(--card3);border:1px solid var(--lime);color:var(--lime);font:700 15px Inter;display:grid;place-items:center;flex-shrink:0}
.hd div{flex:1}.hd b{font-size:22px;font-weight:600;display:block;line-height:1.4}.hd small{color:var(--mu);font-size:12px}
.ic{background:var(--card2);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
.body{padding:0 22px;display:flex;flex-direction:column;gap:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px}
.h{display:flex;justify-content:space-between;align-items:center}.h b{font-size:17px;font-weight:600}.h a{color:var(--lime);font-size:12px}
.tag{background:var(--card3);color:var(--lime);border-radius:8px;padding:3px 9px;font-size:11px;font-weight:500;white-space:nowrap;display:inline-block}
.bar{height:5px;background:var(--bd);border-radius:100px}.bar i{display:block;height:5px;background:var(--lime);border-radius:100px}
.sp{display:flex;justify-content:space-between;align-items:center}
.mu{color:var(--mu);font-size:11px}
.forest{position:relative;overflow:hidden;border-radius:18px;padding:18px;background:linear-gradient(135deg,#16271f,#1d3a28 60%,#2a4a35)}
.forest b{font-size:40px;font-weight:600;line-height:1.2}.forest .f{display:flex;gap:6px;align-items:center;color:var(--lime);font-size:12px;margin-bottom:10px}.forest .f svg{width:16px}
.forest .bar{margin:10px 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g2 .card b{font-size:28px;font-weight:600;display:block;margin-top:6px}
.t{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--bd);cursor:pointer}.t:last-child{border:0}
.cb{width:22px;height:22px;border:1px solid var(--dim);border-radius:7px;flex-shrink:0;display:grid;place-items:center}.cb svg{display:none;stroke:var(--ink);width:16px}
.t.done .cb{background:var(--lime);border-color:var(--lime)}.t.done .cb svg{display:block}.t.done b{color:var(--dim);text-decoration:line-through}
.t div{flex:1}.t b{font-weight:500;display:block;font-size:14px}.t p{display:flex;justify-content:space-between;color:var(--mu);font-size:11px}
.row{display:flex;gap:12px;align-items:center}.row>div{flex:1}.row b{display:block;font-weight:500;font-size:14px}
.ib{width:36px;height:36px;border-radius:12px;background:var(--card3);display:grid;place-items:center;flex-shrink:0}
.search{background:var(--card);border:1px solid var(--bd);border-radius:14px;height:46px;display:flex;gap:10px;align-items:center;padding:0 14px;color:var(--dim)}.search svg{stroke:var(--mu);width:18px}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.days button{background:var(--card);border:1px solid var(--bd);border-radius:14px;height:73px;color:var(--mu);font:11px 'Noto Sans Bengali';display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}.days b{font-size:22px;color:var(--tx)}.days .on{background:var(--lime);border-color:var(--lime);color:var(--ink)}.days .on b{color:var(--ink)}
.flt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.flt button{background:var(--card2);color:var(--mu);border:0;border-radius:12px;height:36px;font:12px 'Noto Sans Bengali';cursor:pointer}.flt .on{background:var(--card3);color:var(--lime)}
.btn{background:var(--lime);color:var(--ink);border:0;border-radius:14px;height:46px;display:flex;gap:8px;align-items:center;justify-content:center;font:600 14px 'Noto Sans Bengali';cursor:pointer;width:100%}.btn svg{stroke:var(--ink);width:18px}.btn.o{background:var(--card2);color:var(--tx);border:1px solid var(--bd)}.btn.o svg{stroke:var(--tx)}
.bal{background:var(--card3);border:1px solid #486332;border-radius:18px;padding:20px}.bal b{font-size:44px;font-weight:600;color:var(--lime);display:block;line-height:1.3;margin:8px 0 14px}
.bal .g2 b{font-size:20px;color:var(--tx);margin:0}.pos{color:var(--lime)!important}.neg{color:var(--red)}
.dist{display:flex;gap:4px;height:10px}.dist i{border-radius:10px}.leg{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:11px;color:var(--mu);margin-top:12px}.leg span:before{content:"";display:inline-block;width:6px;height:6px;border-radius:3px;background:var(--c);margin-right:5px}
.tx{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd)}.tx:last-child{border:0}.tx div{flex:1}.tx b{display:block;font-weight:500}.tx small{color:var(--mu);font-size:11px}.tx em{font-style:normal;font-weight:600}
.pf{text-align:center}.pf .av{width:76px;height:76px;font-size:26px;margin:0 auto 10px;background:var(--card3)}.pf b{font-size:24px;font-weight:600;display:block}
.ach{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}.ach b{font-size:24px;color:var(--lime);display:block;font-weight:600}
.set{display:flex;gap:12px;align-items:center;height:42px;border-bottom:1px solid var(--bd);cursor:pointer}.set:last-child{border:0}.set svg{stroke:var(--mu);width:19px}.set span{flex:1}.set em{font-style:normal;color:var(--mu);font-size:12px}
.sw{width:38px;height:22px;border-radius:22px;background:var(--bd);position:relative;flex-shrink:0}.sw:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--mu);transition:.2s}.sw.on{background:var(--lime)}.sw.on:after{left:19px;background:var(--ink)}
input,select{outline:0}.in{background:var(--card2);border:1px solid var(--bd);border-radius:12px;height:44px;padding:0 12px;color:var(--tx);font:14px 'Noto Sans Bengali';width:100%}
.md{display:none;position:fixed;inset:0;background:#000a;z-index:20;align-items:flex-end;justify-content:center}.md.on{display:flex}
.sh{background:var(--card);border-top:1px solid var(--bd);width:100%;max-width:430px;border-radius:20px 20px 0 0;padding:20px 22px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}.sh b{font-size:18px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--side);border-top:1px solid var(--bd);display:flex;padding:12px 14px calc(24px + env(safe-area-inset-bottom));z-index:9}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--dim);cursor:pointer}nav a svg{stroke:var(--dim);width:21px}
nav a.on{color:var(--lime)}nav a.on svg{stroke:var(--lime)}nav a.on .p{background:var(--card3)}.p{width:56px;height:30px;border-radius:15px;display:grid;place-items:center}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<div id="mt" class="md" onclick="if(event.target==this)clT()"><div class="sh"><b id="mtt">আয় যোগ করুন</b><input id="tn" class="in" placeholder="বিবরণ (যেমন: বেতন)"><input id="ta" class="in" type="number" inputmode="numeric" placeholder="পরিমাণ (৳)"><select id="tc" class="in"></select><button class="btn" onclick="subT()">যোগ করুন</button></div></div>
<div id="md" class="md" onclick="if(event.target==this)cl()"><div class="sh"><b>নতুন কাজ</b><input id="fn" class="in" placeholder="কাজের নাম"><select id="fc" class="in"><option>ব্যক্তিগত</option><option>WebsitesDeal</option><option>SNK IT Institute</option><option>আর্থিক</option></select><input id="ft" class="in" type="time"><button class="btn" onclick="sub()">যোগ করুন</button></div></div>
<script>
const NOW=new Date(),TD=()=>NOW.toLocaleDateString('bn-BD',{weekday:'long',day:'numeric',month:'long'}),MN=NOW.toLocaleDateString('bn-BD',{month:'long',year:'numeric'}),DT=NOW.toLocaleDateString('bn-BD',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const $=id=>document.getElementById(id),ic=n=>`<i data-lucide="${n}"></i>`;
const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
let tasks=[['Monthly-report.html আপডেট','WebsitesDeal','দুপুর ২:০০',0,[]],['বাজার থেকে প্রয়োজনীয় জিনিস কেনা','ব্যক্তিগত','বিকাল ৪:০০',0,[]],['মাসিক হিসাব আপডেট','আর্থিক','বিকাল ৫:০০',0,[]],['নতুন কোর্সের পরিকল্পনা','SNK IT Institute','সন্ধ্যা ৬:০০',0,[]],['Admin changes সম্পন্ন করা','WebsitesDeal','সকাল ১০:০০',1,[]]];
try{const q=JSON.parse(localStorage.getItem('snk_tasks'));if(q)tasks=q}catch(e){}
const save=()=>{try{localStorage.setItem('snk_tasks',JSON.stringify(tasks))}catch(e){}};
const P=()=>{const d=tasks.filter(t=>t[3]).length,n=tasks.length;return[bn(d),bn(n),n?Math.round(d/n*100):0,bn(n-d)]};
let cur=0,tab='home',day=4,flt=0,sw=[1,1,1];
const hd=(l,t,s,r)=>`<div class="hd"><div class="av">SNK</div><div><b>${t}</b><small>${s}</small></div><div class="ic">${ic(r)}</div></div>`;
const task=(t,i)=>`<div class="t ${t[3]?'done':''}"><span class="cb" onclick="tog(${i})">${ic('check')}</span><div onclick="openT(${i})"><b>${t[0]}</b><p><span>${t[1]}</span><span style="color:var(--lime)">${t[2]}</span></p></div></div>`;
let T=[['WebsitesDeal পেমেন্ট','প্রজেক্ট আয়','আজ',10000,'briefcase-business'],['ফ্রিল্যান্স আয়','প্রজেক্ট আয়','১২ মে',15000,'briefcase-business'],['বাসা ভাড়া','বাসস্থান','১৫ মে',-5000,'house'],['ইন্টারনেট বিল','ইউটিলিটি','১৪ মে',-1200,'wifi'],['কোর্স ফি','শিক্ষা','১২ মে',-2300,'graduation-cap'],['বাজার খরচ','খাবার','১০ মে',-4000,'shopping-basket']];
try{const q=JSON.parse(localStorage.getItem('snk_tx'));if(q)T=q}catch(e){}
let B=20000;try{const q=+localStorage.getItem('snk_budget');if(q)B=q}catch(e){}
const saveB=()=>{try{localStorage.setItem('snk_budget',B)}catch(e){}};
const saveT=()=>{try{localStorage.setItem('snk_tx',JSON.stringify(T))}catch(e){}};
const M=()=>{const inc=T.filter(t=>t[3]>0).reduce((a,t)=>a+t[3],0),exp=-T.filter(t=>t[3]<0).reduce((a,t)=>a+t[3],0);return{inc,exp,bal:inc-exp,pct:Math.round(exp/B*100),n:T.filter(t=>t[3]>0).length}};
const fm=n=>'৳ '+bn(Math.abs(n).toLocaleString('en-IN')),fb=n=>(n<0?'− ':'')+fm(n);
const txh=a=>a.map(t=>`<div class="tx" style="cursor:pointer" onclick="delTx(${T.indexOf(t)})"><div class="ib" style="flex:none">${ic(t[4])}</div><div><b>${t[0]}</b><small>${t[2]} • ${t[1]}</small></div><em class="${t[3]>0?'pos':'neg'}">${t[3]>0?'+':'−'} ${fm(t[3])}</em></div>`).join('');
const CL=['#bcf568','#7fb04d','#486332','#f0a28f','#a4b5a7'];
const dist=()=>{const g={};T.filter(t=>t[3]<0).forEach(t=>g[t[1]]=(g[t[1]]||0)-t[3]);const k=Object.keys(g);if(!k.length)return '<p class="mu">কোনো ব্যয় নেই</p>';return `<div class="dist">${k.map((c,i)=>`<i style="flex:${g[c]};background:${CL[i%5]}"></i>`).join('')}</div><div class="leg">${k.map((c,i)=>`<span style="--c:${CL[i%5]}">${c}</span>`).join('')}</div>`};
const S={
home:()=>hd(0,'আসসালামু আলাইকুম, সাইফুল',TD(),'bell')+`<div class="body">
<div><b style="font-size:22px;font-weight:600">আজকের লক্ষ্য এগিয়ে নিন</b><div class="mu" style="font-size:13px">জীবনটা হোক গোছানো।</div></div>
<div class="forest"><div class="f">${ic('flame')}টানা ৭ দিন এগিয়ে চলেছেন!</div><b>${P()[0]} / ${P()[1]}</b> <span class="mu">কাজ সম্পন্ন</span><div class="bar"><i style="width:${P()[2]}%"></i></div><div class="mu">আজকের রুটিনে আরও ২টি অভ্যাস পূরণ করুন।</div></div>
<div class="g2"><div class="card"><div class="mu row" style="gap:6px">${ic('folder-kanban')}চলমান প্রজেক্ট</div><b>৩টি</b></div><div class="card"><div class="mu row" style="gap:6px">${ic('wallet')}ব্যালেন্স</div><b>${fb(M().bal)}</b></div></div>
<div><div class="h" style="margin-bottom:6px"><b>অগ্রাধিকার কাজ</b><a onclick="go('tasks')">সব দেখুন →</a></div><div class="card" style="padding:0 14px">${tasks.slice(0,2).map(task).join('')}</div></div>
<div><div class="h" style="margin-bottom:10px"><b>প্রধান প্রজেক্ট</b><a>সব →</a></div><div class="card"><div class="row" style="margin-bottom:12px"><div class="ib">${ic('globe')}</div><div><b style="font-family:Inter">WebsitesDeal</b><span class="mu">ওয়েবসাইট উন্নয়ন • ১৮ মে</span></div><b style="color:var(--lime);font-size:18px;flex:none">৬৭%</b></div><div class="bar"><i style="width:67%"></i></div></div></div>
<div class="card row">${ic('alarm-clock')}<div><span class="mu">পরবর্তী রুটিন • ১৩:১৫</span><b style="font-size:16px">জুমার নামাজ</b></div>${ic('chevron-right')}</div></div>`,
tasks:()=>hd(0,'আমার কাজ',P()[3]+'টি কাজ বাকি','sliders-horizontal')+`<div class="body">
<div class="search">${ic('search')}কাজ খুঁজুন...</div>
<div class="days">${[-4,-3,-2,-1,0].map(k=>{const d=new Date(NOW);d.setDate(d.getDate()+k);return[d.toLocaleDateString('bn-BD',{weekday:'short'}),d.getDate()]}).map((d,i)=>`<button class="${i==day?'on':''}" onclick="day=${i};render()">${d[0]}<b>${bn(d[1])}</b></button>`).join('')}</div>
<div class="card"><div class="sp" style="margin-bottom:10px"><b>আজকের অগ্রগতি</b><span class="mu">${P()[0]} / ${P()[1]} সম্পন্ন</span></div><div class="bar"><i style="width:${P()[2]}%"></i></div></div>
<div class="flt">${['সব কাজ','পেন্ডিং','সম্পন্ন'].map((f,i)=>`<button class="${i==flt?'on':''}" onclick="flt=${i};render()">${f}</button>`).join('')}</div>
<div class="card" style="padding:0 14px">${tasks.map((t,i)=>[t,i]).filter(([t])=>flt==0||(flt==1)!=!!t[3]).map(([t,i])=>task(t,i)).join('')||'<p class="mu" style="padding:16px">কোনো কাজ নেই</p>'}</div>
<button class="btn" onclick="add()">${ic('plus')}নতুন কাজ যোগ করুন</button></div>`,
detail:()=>{const t=tasks[cur];if(!t)return S.home();const st=t[4]=t[4]||[],d=st.filter(x=>x[1]).length;return `<div class="hd"><div class="ic" onclick="go('tasks')">${ic('arrow-left')}</div><div><b>কাজের বিবরণ</b><small>${t[1]}</small></div><div class="ic" onclick="del()">${ic('trash-2')}</div></div><div class="body"><div><span class="tag">${t[3]?'সম্পন্ন':'পেন্ডিং'}</span><h2 style="font-size:26px;font-weight:600;margin-top:10px;line-height:1.4">${t[0]}</h2></div>
<div class="card row"><div class="ib">${ic('calendar-days')}</div><div><span class="mu">সময়সীমা</span><b>${t[2]}</b></div></div>
<div class="card"><div class="sp" style="margin-bottom:10px"><b>সাবটাস্ক</b><span class="mu">${bn(d)} / ${bn(st.length)}</span></div><div class="bar"><i style="width:${st.length?d/st.length*100:0}%"></i></div>${st.map((x,j)=>`<div class="t ${x[1]?'done':''}" onclick="stog(${j})"><span class="cb">${ic('check')}</span><div><b>${x[0]}</b></div></div>`).join('')}<div class="row" style="margin-top:12px"><input id="si" class="in" placeholder="নতুন সাবটাস্ক..."><button class="btn" style="width:auto;padding:0 18px;flex:none" onclick="sadd()">যোগ</button></div></div>
<button class="btn" onclick="tog(${cur})">${ic('check')}${t[3]?'আবার পেন্ডিং করুন':'সম্পন্ন করুন'}</button></div>`},
wallet:()=>hd(0,'ওয়ালেট',MN,'ellipsis')+`<div class="body">
<div class="bal"><span class="mu">মোট ব্যালেন্স</span><b>${fb(M().bal)}</b><div class="g2"><div><span class="mu">↙ আয়</span><b class="pos">${fm(M().inc)}</b></div><div><span class="mu">↗ ব্যয়</span><b>${fm(M().exp)}</b></div></div></div>
<div class="g2"><button class="btn" onclick="addTx(1)">${ic('plus')}আয় যোগ</button><button class="btn o" onclick="addTx(-1)">${ic('minus')}ব্যয় যোগ</button></div>
<div class="card"><div class="sp"><b>মাসিক বাজেট</b><span class="mu">${bn(M().pct)}% ব্যবহার</span></div><div class="bar" style="margin:12px 0 8px"><i style="width:${Math.min(100,M().pct)}%;${M().pct>100?'background:var(--red)':''}"></i></div><div class="sp mu"><span>${fm(M().exp)} ব্যয়</span><span onclick="setB()" style="color:var(--lime);cursor:pointer">${fm(B)} ✎</span></div></div>
<div><div class="h" style="margin-bottom:12px"><b>ব্যয়ের বিভাজন</b></div>${dist()}</div>
<div><div class="h" style="margin-bottom:6px"><b>সাম্প্রতিক লেনদেন</b><a>সব →</a></div><div class="card" style="padding:0 14px">${txh(T.slice(0,5))||'<p class="mu" style="padding:16px">কোনো লেনদেন নেই</p>'}</div></div></div>`,
me:()=>hd(0,'প্রোফাইল','অ্যাকাউন্ট ও সেটিংস','ellipsis')+`<div class="body">
<div class="pf"><div class="av">SNK</div><b>সাইফুল ইসলাম</b><span class="mu">Personal workspace</span><div style="margin:10px 0"><span class="tag">সক্রিয় সদস্য</span></div><span style="color:var(--lime);font-size:12px">✎ প্রোফাইল এডিট করুন</span></div>

tasks.unshift([n,$('fc').value,t,0,[]]);save();cl();go('tasks')}

let tsign=1;const CI=['প্রজেক্ট আয়','বেতন','অন্যান্য আয়'],CE=['বাসস্থান','খাবার','ইউটিলিটি','শিক্ষা','যাতায়াত','অন্যান্য'];
